name: Scheduler tests

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: scheduler-tests-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.9'
          - os: ubuntu-latest
            python: '3.13'
          - os: macos-latest
            python: '3.13'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Archive exact tested source
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        run: |
          mkdir -p "$RUNNER_TEMP/qualification-source"
          git archive --format=zip HEAD -o "$RUNNER_TEMP/qualification-source/source.zip"
          git rev-parse HEAD > "$RUNNER_TEMP/qualification-source/commit.txt"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        if: matrix.os == 'ubuntu-latest' && matrix.python == '3.13'
        with:
          name: tested-source
          path: ${{ runner.temp }}/qualification-source/
          retention-days: 7
          if-no-files-found: error
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: ${{ matrix.python }}
      - name: Compile Python sources
        run: python -m compileall -q .
      - name: Unit and real-worker integration tests
        env:
          KYOTO_TEST_CARGO: '1'
        run: python -m unittest discover -s tests -v
      - name: Isolated research characterization and packaging tests
        if: matrix.python == '3.13'
        run: |
          python -m pip install -r experiments/adaptive_research/requirements.txt
          python -m unittest discover -s experiments/adaptive_research -p 'test_*.py' -v
      - name: Whitespace validation
        run: git diff --check HEAD^ HEAD
