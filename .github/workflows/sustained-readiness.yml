name: Sustained Cargo capacity qualification

on:
  pull_request:
    paths:
      - '.github/workflows/sustained-readiness.yml'

permissions:
  contents: read

concurrency:
  group: sustained-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        budget: [2, 8]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Real sustained isolated Cargo batches
        run: |
          python experiments/native_cargo_qualification.py --output qualification/cargo.json --budget ${{ matrix.budget }} --jobs 16 --functions 256 --repeats 2 --kinds cold --timeout 180
      - name: Retain sanitized results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: sustained-readiness-${{ matrix.os }}-cap${{ matrix.budget }}
          path: qualification/cargo.json
          retention-days: 14
