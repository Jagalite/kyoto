name: Native Windows

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 10
    strategy:
      matrix:
        python: ['3.9', '3.13']
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r requirements-windows.txt
      - run: python -m compileall -q .
      - name: Native queue, Cargo, cancellation, and recovery
        run: python -m unittest discover -s tests -p test_windows_runtime.py -v
      - name: Scheduling and policy regressions
        env:
          PYTHONPATH: tests
        run: python -m unittest test_commands test_command_policy test_scheduling test_progress test_progress_objective test_hill_climbing test_hill_telemetry test_kyoto_mode test_deferral test_preemption test_active_draining test_drain_revalidation test_disk_policy test_disk_io test_execution_plan test_target_sizes -v
