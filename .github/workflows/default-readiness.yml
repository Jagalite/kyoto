name: Default readiness Cargo qualification

on:
  pull_request:
    paths:
      - 'experiments/native_cargo_qualification.py'
      - '.github/workflows/default-readiness.yml'

permissions:
  contents: read

concurrency:
  group: default-readiness-${{ github.ref }}
  cancel-in-progress: true

jobs:
  cargo:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.13'
      - name: Check benchmark and toolchain
        run: |
          python -m py_compile experiments/native_cargo_qualification.py
          cargo --version
          rustc --version
      - name: Real isolated Cargo batches
        run: |
          python experiments/native_cargo_qualification.py --output qualification/cargo.json --budget 4 --jobs 8 --functions 64 --repeats 2
      - name: Retain sanitized results only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: default-readiness-${{ matrix.os }}
          path: qualification/cargo.json
          retention-days: 14
